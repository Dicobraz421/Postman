[package]
name = "postman-cache"
description = "Локальный SQLite-кэш: список писем, тела, состояния синхронизации"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
redb = "4"
serde.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }
# Хэш содержимого (ADR 0006 п. 2): SHA-256 — та же версия, что у `smime`.
sha2 = "0.11"
# Сжатие скелетов, тел и сжимаемых частей (формат 7, ADR 0006 дополнение 2026-11-14): libzstd (BSD), без старых
# форматов и построителя словарей.
zstd = { version = "0.14.4", default-features = false, optional = true }

[features]
# Формат 6 — единое хранилище (ADR 0006): до приёмки S8 за признаком, без него — формат 5.
store6 = ["dep:zstd"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
