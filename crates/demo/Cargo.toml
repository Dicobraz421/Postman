[package]
name = "postman-demo"
description = "Синтетический ящик для замеров и демонстрации без сервера (общий для UI-вариантов)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Демо-канал бесед (ADR 0012): договор `postman_core::channel` и его проверки. Тот же слой L2, без протоколов.
postman-core.workspace = true
# Формат 6 (S8-14): «На этом компьютере», содержимое по хэшу, задания переноса.
postman-cache = { workspace = true, features = ["store6"] }
jiff.workspace = true
postman-calendar.workspace = true
# Большая картинка в тексте письма (S5-07б) — собирается при первом запросе, а не лежит в репозитории.
png = "0.17"

[dev-dependencies]
# Сборка и проверка подписанных образцов (S5-12, `tests/smime_samples.rs`).
postman-smime = { workspace = true, features = ["testkit"] }
# Проверка образцов письмами целиком: MIME S/MIME разбирает воркер (S8-36).
postman-worker.workspace = true
# Замер хранилища (`tests/store_size.rs`): размер файла после уплотнения — та же redb, что у `postman-cache`.
redb = "4"

[lints]
workspace = true
