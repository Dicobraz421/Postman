[package]
name = "postman-demo"
description = "Синтетический ящик для замеров и демонстрации без сервера (общий для UI-вариантов)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Формат 6 (S8-14): «На этом компьютере», содержимое по хэшу, задания переноса.
postman-cache = { workspace = true, features = ["store6"] }
jiff = "0.2"
postman-calendar.workspace = true
# Большая картинка в тексте письма (S5-07б) — собирается при первом запросе, а не лежит в репозитории.
png = "0.17"

[dev-dependencies]
# Сборка и проверка подписанных образцов (S5-12, `tests/smime_samples.rs`).
postman-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
