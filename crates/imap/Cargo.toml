[package]
name = "postman-imap"
description = "IMAP and SMTP submission client for Postman (S7-04): folders, sync state, flags, messages, IDLE"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# IMAP (MIT OR Apache-2.0): разбор — imap-proto; рантайм — tokio, как у остального ядра.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# SMTP submission (Apache-2.0 OR MIT, автор mail-parser/mail-builder): без DKIM и разбора.
mail-send = { version = "0.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
futures = "0.3"
# Кодировки encoded words (RFC 2047) в полях ENVELOPE — таблица WHATWG; тот же крейт уже в сборке (интерфейс).
encoding_rs = "0.8"
thiserror.workspace = true
tracing = "0.1"


[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

[lints]
workspace = true
