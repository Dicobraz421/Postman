[package]
name = "postman-ews"
description = "Minimal EWS client for on-prem Exchange (S7-06): Autodiscover POX, SSPI Negotiate/NTLM, calendar, availability, GAL"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Подменный сервер EWS в тестах `postman-core`: адрес http:// без TLS. В рабочей сборке выключен.
testkit = []

[dependencies]
postman-calendar.workspace = true
# HTTP/1.1 — тот же hyper, что под reqwest, но одним соединением на сессию: NTLM привязан к TCP, пул reqwest не
# гарантирует, что все ответы рукопожатия уйдут по одному соединению.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "time", "rt"] }
# TLS — SChannel Windows (шифры Exchange на старых Windows Server rustls не умеет, `http.rs`); сертификат — хранилище
# Windows, привязка к каналу — из сертификата сервера.
native-tls = "0.2"
tokio-native-tls = "0.3"
# Ответы SOAP и Autodiscover: без DTD и сущностей (ADR 0003); та же версия, что уже в сборке.
quick-xml = { version = "0.41", default-features = false }
base64 = "0.22"
# Привязка к каналу TLS (`tls-server-end-point`, RFC 5929): хэш сертификата сервера.
sha2 = "0.11.1"
jiff = "0.2"
url.workspace = true
zeroize = "1"
thiserror.workspace = true
tracing = "0.1"

# Вход с паролем — NTLMv2 на чистом Rust (`ntlm.rs`), одинаково на Windows и macOS: MD4, HMAC-MD5, случайный вызов
# клиента. RustCrypto, MIT/Apache.
md4 = "0.11"
md-5 = "0.11"
hmac = "0.13"
getrandom = "0.4"

# SSPI (Negotiate, NTLM) — `sys.rs`, единственное место `unsafe`; та же версия `windows`, что у gpui и app-gpui.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security_Authentication_Identity", "Win32_Security_Credentials"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
futures = "0.3"
# Разведка боевого Exchange (`tests/probe.rs`): IMAP4 и вход SMTP submission — без отправки писем.
postman-imap.workspace = true
mail-send = { version = "0.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints]
workspace = true
