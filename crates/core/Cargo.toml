[package]
name = "postman-core"
description = "Слой без UI и без протоколов: модель, кэш, договор путей к серверам (плагины), поиск, извлечение текста, разбор писем в воркере, файлы, адресная книга"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
postman-ir.workspace = true
postman-cache = { workspace = true, features = ["store6"] }
postman-worker.workspace = true
postman-compose.workspace = true
postman-search.workspace = true
postman-calendar.workspace = true
# Выгрузка писем в файлы (S8-31): задание экспорта ядра пишет файлы форматами крейта, I/O — в потоке ядра.
postman-export.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jiff.workspace = true
cpu-time = "1"
memory-stats = "1"
open = "5"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
# Типы итога проверки S/MIME (S5-12); сам разбор и проверка — только в воркере.
postman-smime = { workspace = true, features = ["soft"] }
zeroize = "1"
tracing = "0.1"

# S/MIME (S5-12): якоря из хранилищ Windows, подтверждение цепочки и отзыв (`smime/windows.rs`), поиск СКЗИ ГОСТ.
# Linux (LIN-05d): CRL и OCSP по `https` — TLS с проверкой сертификата системы, как у LDAP и IMAP.
[target.'cfg(target_os = "linux")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12", "std"] }
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
# PAR-04 (№36, №47, №48): известные папки (`SHGetKnownFolderPath`) — «Загрузки», «Документы», Program Files, System32.
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell"]

# S/MIME на macOS (MAC-05, `smime/macos.rs`, `smime/keychain.rs`): якоря и подтверждение цепочки — `SecTrust`, подпись и
# расшифровка — `SecIdentity`/`SecKey` из Связки ключей.
[target.'cfg(target_os = "macos")'.dependencies]
# `macos-12`: `SecTrustCopyCertificateChain` (цель — macOS 13+).
security-framework = { version = "3.7", features = ["macos-12"] }
security-framework-sys = "2.17"
core-foundation = "0.10"

[dev-dependencies]
postman-smime = { workspace = true, features = ["testkit"] }
# Демо-данные в тестах поручений и меток; в обычных зависимостях демо нет (слои).
postman-demo.workspace = true
tempfile = "3"

[lints]
workspace = true
