[package]
name = "postman-worker"
description = "Изолированный воркер: HTML/текст письма -> IR. Без сети, ФС и GUI."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
zeroize = "1"
postman-ir.workspace = true
# Проверка подписи S/MIME (S5-12): разбор CMS и цепочка — только здесь, в песочнице.
postman-smime.workspace = true
serde.workspace = true
serde_json.workspace = true
calcard = "0.3"
# Письмо IMAP целиком → тело и вложения (S7-04б): тот же разборщик, что у S/MIME, — только здесь, в песочнице.
mail-parser = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Встроенный просмотр вложений (S5-07): PDF — чистый Rust без unsafe (Apache-2.0 OR MIT), стандартные шрифты
# Foxit (BSD) встроены, таблицы CJK — нет; ZIP — только оглавление и `vbaProject.bin` (MIT); OLE — составные
# файлы Office (MIT).
hayro = { version = "0.8", default-features = false, features = ["embed-fonts"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cfb = "0.15"
# Просмотр .docx (T1-13а): потоковый XML без DTD и своих сущностей — тот же крейт, что у `dav` и `ews`.
quick-xml = { version = "0.41", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]

# Версия exe (build.rs, rc.exe из Windows SDK).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
postman-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
