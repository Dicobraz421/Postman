[package]
name = "postman-worker"
description = "Изолированный воркер: HTML/текст письма -> IR. Без сети, ФС и GUI."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
zeroize = "1"
postman-ir.workspace = true
# Проверка подписи S/MIME (S5-12): разбор CMS и цепочка — только здесь, в песочнице.
postman-smime.workspace = true
serde.workspace = true
serde_json.workspace = true
calcard = "0.3"
# Письмо IMAP целиком → тело и вложения (S7-04б): тот же разборщик, что у S/MIME, — только здесь, в песочнице.
mail-parser = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
# Встроенный просмотр вложений (S5-07): PDF — чистый Rust без unsafe (Apache-2.0 OR MIT), стандартные шрифты
# Foxit (BSD) встроены, таблицы CJK — нет; ZIP — только оглавление и `vbaProject.bin` (MIT); OLE — составные
# файлы Office (MIT).
hayro = { version = "0.8", default-features = false, features = ["embed-fonts"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cfb = "0.15"
# Просмотр .docx (T1-13а): потоковый XML без DTD и своих сущностей — тот же крейт, что у `dav` и `ews`.
quick-xml = { version = "0.41", default-features = false }
# Просмотр .md (S8): тот же разборщик, что у `compose`.
pulldown-cmark = { version = "0.13", default-features = false }
# Хост модулей просмотра на WASM (S8, ADR 0007, решение A): интерпретатор без `wat` — модуль только двоичный.
# Только для `postman-viewer.exe` (признак `viewer`): интерфейс, ядро и плагины зависят от воркера без него.
wasmi = { version = "2", default-features = false, features = ["std", "stable", "validate", "auto-dispatch"], optional = true }
# Ответ модуля просмотра (ABI v1, ADR 0007) — postcard, как у `cache`; разбирает только `postman-viewer.exe`.
postcard = { version = "1", default-features = false, features = ["use-std"], optional = true }

[features]
viewer = ["dep:wasmi", "dep:postcard"]

[[bin]]
name = "postman-worker"
path = "src/bin/postman-worker.rs"

# Хост модулей просмотра (S8-24): та же песочница, только с признаком `viewer` — в воркере `wasmi` нет.
[[bin]]
name = "postman-viewer"
path = "src/bin/postman-viewer.rs"
required-features = ["viewer"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
landlock = "0.4"
seccompiler = "0.5"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]

# Версия exe (build.rs, rc.exe из Windows SDK).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Тесты хоста модулей (tests/viewer.rs) и сборка `postman-viewer.exe` к ним: признак `viewer` у себя.
postman-worker = { path = ".", features = ["viewer"] }
postman-smime = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
