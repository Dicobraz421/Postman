[package]
name = "postman-gpui"
description = "Postman: почта, календарь и контакты (интерфейс на gpui)"
edition.workspace = true
version.workspace = true
license.workspace = true

# Исполняемый файл — postman.exe (S4-01); пакет остаётся postman-gpui: `cargo run -p postman-gpui`.
[[bin]]
name = "postman"
path = "src/main.rs"

[features]
# Считающий распределитель для замера кучи Rust в `--bench` (S4-08, docs/MEMORY.md); в обычной сборке выключен.
alloc-count = []

[dependencies]
# Отчёт для поддержки (S5-30): архив журнала и настроек; тот же крейт, что у воркера.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
postman-ir.workspace = true
postman-cache.workspace = true
postman-worker.workspace = true
# Типы итога проверки подписи S/MIME (S5-12); разбор — в воркере.
postman-smime.workspace = true
postman-demo.workspace = true
zeroize = "1"
postman-calendar.workspace = true
gpui-kit = "0.7"
jiff = "0.2"
postman-core.workspace = true
# Пути к серверам — плагины (ADR 0004): регистрирует `src/plugins.rs`; протокольных крейтов интерфейс не знает.
postman-backend-jmap.workspace = true
postman-backend-imap.workspace = true
postman-backend-dav.workspace = true
postman-backend-ews.workspace = true
# Каталог сертификатов адресатов (S5-12 Ф5): плагин ядра, LDAP знает только он.
postman-backend-ldap.workspace = true
postman-search.workspace = true
serde.workspace = true
serde_json.workspace = true
postman-compose.workspace = true
pets-commands = { git = "https://github.com/Dicobraz/pets", rev = "b1e344098d9ce15bec9bfa5f273f211ca0fec81f" }
pets-i18n = { git = "https://github.com/Dicobraz/pets", rev = "b1e344098d9ce15bec9bfa5f273f211ca0fec81f" }
# T3-06: `clipboard` (HTML буфера обмена, pets#44); MAC-02: Связка ключей, экземпляр и `mailto` на macOS (pets#48);
# системный журнал по уровню настройки и правило уровней `LOGGING.md` (pets#58).
pets-shell = { git = "https://github.com/Dicobraz421/pets", rev = "44937ec07da8f11f382d4ef7785b57062a9d4e4d" }
pets-ui = { git = "https://github.com/Dicobraz/pets", rev = "b1e344098d9ce15bec9bfa5f273f211ca0fec81f" }
# Обновление программы (решение 2026-11-11 «self-update», Postman#503): проверка GitHub Releases, подпись minisign,
# установка MSI и portable. Единственная сеть интерфейса по своей инициативе — только модуль `update`.
pets-update = { git = "https://github.com/Dicobraz421/pets", rev = "c767dfd4489033e2c359e159481f23bd7119646a" }
futures = "0.3"
tracing = "0.1"
# Снимки экранов (`--screens`, S2-05): запись PNG.
png = "0.17"
# Картинки `cid:` (S3-03): воркер отдаёт готовые пиксели RGBA, здесь — только кадр для gpui, без декодеров.
image = { version = "0.25", default-features = false }

# Платформенный код (окно, перетаскивание, оболочка, учётные данные) — нейтральный API `gpui_windows::pets` патча
# Windows-платформы gpui (pets-gpui-windows, `[patch]` в корне); версия — как у gpui-kit. Своих `windows`/`windows-sys`
# у интерфейса нет (решение владельца 2026-10-28).
[target.'cfg(windows)'.dependencies]
gpui-pre-windows = "=0.3.9"

# macOS (MAC-02): окно, снимок, перетаскивание, уведомления — `pets_gpui_macos` (аналог `gpui_windows::pets`, pets#48).
[target.'cfg(target_os = "macos")'.dependencies]
pets-gpui-macos = { git = "https://github.com/Dicobraz/pets", rev = "4bde6054717a0a6e614b6929292d619d920d939c" }

# Значок, версия и манифест exe (build.rs, rc.exe из Windows SDK).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Каналы команд синхронизации в тестах маршрутизации (S7-03б); та же версия, что у postman-core.
tokio = { version = "1", default-features = false, features = ["sync"] }

[lints]
workspace = true
