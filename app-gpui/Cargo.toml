[package]
name = "postman-gpui"
description = "Postman: почта, календарь и контакты (интерфейс на gpui)"
edition.workspace = true
version.workspace = true
license.workspace = true

# Исполняемый файл — postman.exe (S4-01); пакет остаётся postman-gpui: `cargo run -p postman-gpui`.
[[bin]]
name = "postman"
path = "src/main.rs"

[features]
# Считающий распределитель для замера кучи Rust в `--bench` (S4-08, docs/MEMORY.md); в обычной сборке выключен.
alloc-count = []

[dependencies]
# Отчёт для поддержки (S5-30): архив журнала и настроек; тот же крейт, что у воркера.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
postman-ir.workspace = true
postman-cache.workspace = true
postman-worker.workspace = true
# Типы итога проверки подписи S/MIME (S5-12); разбор — в воркере.
postman-smime.workspace = true
postman-demo.workspace = true
zeroize = "1"
postman-calendar.workspace = true
gpui-kit = "0.7"
jiff = "0.2"
postman-core.workspace = true
# Пути к серверам — плагины (ADR 0004): регистрирует `src/plugins.rs`; протокольных крейтов интерфейс не знает.
postman-backend-jmap.workspace = true
postman-backend-imap.workspace = true
postman-backend-dav.workspace = true
postman-backend-ews.workspace = true
postman-search.workspace = true
serde.workspace = true
serde_json.workspace = true
postman-compose.workspace = true
pets-commands = { git = "https://github.com/Dicobraz/pets", rev = "7a450e49286553392fc3a494665670162e334793" }
pets-i18n = { git = "https://github.com/Dicobraz/pets", rev = "7a450e49286553392fc3a494665670162e334793" }
pets-shell = { git = "https://github.com/Dicobraz/pets", rev = "7a450e49286553392fc3a494665670162e334793" }
pets-ui = { git = "https://github.com/Dicobraz/pets", rev = "7a450e49286553392fc3a494665670162e334793" }
futures = "0.3"
tracing = "0.1"
# Снимки экранов (`--screens`, S2-05): дескриптор окна и запись PNG.
raw-window-handle = "0.6"
png = "0.17"
# Картинки `cid:` (S3-03): воркер отдаёт готовые пиксели RGBA, здесь — только кадр для gpui, без декодеров.
image = { version = "0.25", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

# Уведомления Windows (S6-07: напоминания задач при свёрнутом окне) — WinRT, та же версия, что у gpui.
# Перетаскивание вложения в другие приложения (T1-18, `sys/dragdrop.rs`): OLE drag source — COM, OLE, оболочка.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
]
# Макрос `#[implement]` (свои COM-объекты перетаскивания, T1-18) ссылается на `windows_core` напрямую.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.61"

# Значок, версия и манифест exe (build.rs, rc.exe из Windows SDK).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"
# Каналы команд синхронизации в тестах маршрутизации (S7-03б); та же версия, что у postman-core.
tokio = { version = "1", default-features = false, features = ["sync"] }

[lints]
workspace = true
