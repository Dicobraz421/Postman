[workspace]
resolver = "3"
members = ["crates/ir", "crates/smime", "crates/jmap", "crates/imap", "crates/dav", "crates/ews", "crates/cache", "crates/compose", "crates/worker", "crates/search", "crates/export", "crates/demo", "crates/calendar", "crates/core", "crates/backend-jmap", "crates/backend-imap", "crates/backend-dav", "crates/backend-ews", "app-gpui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
postman-ir = { path = "crates/ir" }
postman-jmap = { path = "crates/jmap" }
postman-imap = { path = "crates/imap" }
postman-dav = { path = "crates/dav" }
postman-ews = { path = "crates/ews" }
postman-cache = { path = "crates/cache" }
postman-compose = { path = "crates/compose" }
postman-search = { path = "crates/search" }
postman-demo = { path = "crates/demo" }
postman-calendar = { path = "crates/calendar" }
postman-core = { path = "crates/core" }
postman-backend-jmap = { path = "crates/backend-jmap" }
postman-backend-imap = { path = "crates/backend-imap" }
postman-backend-dav = { path = "crates/backend-dav" }
postman-backend-ews = { path = "crates/backend-ews" }
postman-worker = { path = "crates/worker" }
postman-smime = { path = "crates/smime" }
postman-export = { path = "crates/export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Просмотр PDF в воркере (S5-07, docs/SIZE.md «Воркер»): рендер одной страницы по запросу — холодный код,
# оптимизация по размеру. Крейты только воркера (gpui их не использует), на postman.exe не влияет.
[profile.release.package.hayro]
opt-level = "s"
[profile.release.package.hayro-interpret]
opt-level = "s"
[profile.release.package.hayro-syntax]
opt-level = "s"
[profile.release.package.hayro-jbig2]
opt-level = "s"
[profile.release.package.hayro-jpeg2000]
opt-level = "s"
[profile.release.package.hayro-ccitt]
opt-level = "s"
[profile.release.package.hayro-cmap]
opt-level = "s"
[profile.release.package.hayro-postscript]
opt-level = "s"
[profile.release.package.vello_cpu]
opt-level = "s"
[profile.release.package.vello_common]
opt-level = "s"
[profile.release.package.fearless_simd]
opt-level = "s"
[profile.release.package.pic-scale]
opt-level = "s"

# Проверка подписи S/MIME (S5-12, docs/SIZE.md «Воркер»): одна проверка на открытое письмо — холодный код, по
# размеру (бюджет воркера ≤ 10 МиБ, решение №6). Кроме `der` и `const-oid` — только в воркере.
[profile.release.package.postman-smime]
opt-level = "s"
[profile.release.package.cms]
opt-level = "s"
[profile.release.package.x509-cert]
opt-level = "s"
[profile.release.package.der]
opt-level = "s"
[profile.release.package.spki]
opt-level = "s"
[profile.release.package.rsa]
opt-level = "s"
[profile.release.package.crypto-bigint]
opt-level = "s"
[profile.release.package.crypto-primes]
opt-level = "s"
[profile.release.package.streebog]
opt-level = "s"

# Хост модулей просмотра на WASM (S8, ADR 0007, решение A): интерпретатор `wasmi` и проверка модуля `wasmparser` —
# холодный код, по размеру. Только в `postman-viewer.exe` (признак `viewer` воркера), на postman.exe не влияет.
[profile.release.package.wasmi]
opt-level = "s"
[profile.release.package.wasmi_core]
opt-level = "s"
[profile.release.package.wasmi_ir]
opt-level = "s"
[profile.release.package.wasmi_collections]
opt-level = "s"
[profile.release.package.wasmparser]
opt-level = "s"

# «Не падать» (S2-03): вне тестов нет unwrap/expect/panic!; в тестах разрешены (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[patch.crates-io]
# Патч Windows-платформы gpui (шейдеры в exe, кадры по запросу, живой ресайз) — общий для приложений Pets:
# github.com/Dicobraz/pets, crates/pets-gpui-windows.
gpui-pre-windows = { git = "https://github.com/Dicobraz/pets", rev = "1fbd05c0317d69e45aa6b2bc4438f6d6013297db" }

# Отладочная информация только для своего кода: target/debug не раздувается до десятков ГБ.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# S/MIME (S5-12): хэши и длинная арифметика в отладочной сборке — с оптимизацией, иначе проверка письма на 60 МБ
# в тестах песочницы упирается в сторожа воркера (8 с), а подписи RSA и ГОСТ в тестах идут секундами.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.streebog]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.postman-smime]
opt-level = 2
