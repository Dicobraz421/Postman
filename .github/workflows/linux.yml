# Сборка Postman для Linux (LIN-01, docs/decisions/2026-11-12-linux.md): x86_64, Ubuntu 24.04.
# Проверки Linux (clippy, wasm32, тесты, снимки) — job `linux` в ci.yml, в `gate` (решение 2026-11-13 «linux-tier1»).
# Здесь — только `bundle`: release и AppImage, deb, rpm на раннере (артефакт Actions для разработки, не выпуск: выпуск
# собирает ci.yml на старом glibc, LIN-06) — на PR (не черновик) и вручную.
name: Linux

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  # Новый пуш в PR отменяет устаревший прогон.
  group: linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  # Системные пакеты сборки (замер 2026-11-12): Kerberos (EWS), окно gpui (xkbcommon, Wayland, xcb), шрифты.
  APT_PACKAGES: libkrb5-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig1-dev

jobs:
  bundle:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Системные пакеты
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $APT_PACKAGES
          rpm squashfs-tools desktop-file-utils
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release-сборка
        run: cargo build --release --workspace --locked --features postman-worker/viewer

      - name: AppImage, deb и rpm
        id: package
        run: bash scripts/linux/package.sh --target-dir "$CARGO_TARGET_DIR" --out dist

      - name: Артефакт сборки
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
