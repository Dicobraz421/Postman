# CI Postman по шаблону скилла pets-dev (R-01).
# PR и merge queue: метки конфликта, полосы, clippy и тесты (nextest) — параллельно, цель ≤7 мин на job при тёплом кэше.
# Docs-PR: сборка пропускается (job `changes`). Черновик PR (draft) не собирается вовсе: CI идёт один раз, когда PR
# готов (ready_for_review), и на каждый пуш после этого (экономия CI, решение 2026-11-12 «ci-economy»).
# Release, подпись, комплекты — теги `v*`, ручной запуск и PR, что правят сам выпуск (job `changes`, выход
# `release`); на пуш в main release не собирается. Тег `v*` — ещё и выпуск на GitHub (job `publish`, схема —
# docs/DEV.md «Выпуск»).
# Required check в защите main — один: `gate`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Ночной прогон — только job `cache`: новая версия stable (ключ кэша включает rustc) прогревается до утренних PR.
  schedule:
    - cron: '17 1 * * *'

concurrency:
  # Новый пуш в PR отменяет устаревший прогон.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Каталог сборки задан явно (H-01): шаги ниже ссылаются на него, а не на зашитый target/.
  CARGO_TARGET_DIR: target

jobs:
  changes:
    # Черновик PR — без CI; `gate` на черновике зелёный (всё пропущено), слить черновик нельзя.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      release: ${{ steps.d.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Нет меток конфликта слияния
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.png'; then
            echo "Метки конфликта слияния в файлах выше"; exit 1
          fi

      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then echo rust=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c core.quotepath=off diff --name-only "$BASE" HEAD > changed.txt
          # Полосы: PR правит одну полосу (x/* — межполосный PR класса B).
          if [ -f lanes.toml ] && [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          if grep -qvE '^(docs/|[^/]*\.md$|.*/README\.md$)' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi
          # PR правит сам выпуск (этот workflow, сборку комплектов, страницу выпуска) — job `release` собирает
          # комплекты всех платформ и выкладывает артефакты, без публикации.
          if grep -qE '^(\.github/workflows/ci\.yml|\.github/release-notes\.md|scripts/|tools/pack/)' changed.txt; then
            echo release=true >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # Пуш в main не тестируется: тот же код уже проверила очередь слияния (merge_group). Тег — тестируется.
    if: >-
      needs.changes.outputs.rust == 'true' && github.event_name != 'schedule' &&
      !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: windows-latest
    env:
      # Компоновщик rust-lld (идёт с rustc) вместо link.exe — быстрее компонует ~100 тестовых exe. Через переменную,
      # не RUSTFLAGS: +crt-static из .cargo/config.toml остаётся. Компоновщик входит в отпечаток cargo и (как CARGO_*)
      # в ключ rust-cache — у `test`, `clippy` и `cache` окружение должно совпадать.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      # Без отладочной информации в CI (в Cargo.toml для своих крейтов — line-tables-only): меньше объём сборки
      # и кэша, быстрее компоновка. Локальная сборка не меняется.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      # Ускорение тестов (решение владельца 2026-11-12): тесты с демо-ящиком (redb во временной папке) на Windows
      # шли по 100–150 с против 4–8 с на Linux/macOS. Временная папка — на диск раннера D: (runner.temp) вместо C:,
      # каталоги сборки, кэша cargo и временный — вне проверки Defender в реальном времени. Набор тестов не меняется;
      # не вышло добавить исключение — только предупреждение.
      - name: Временная папка и исключения Defender
        shell: pwsh
        run: |
          $tmp = "${{ runner.temp }}"
          "TEMP=$tmp" >> $env:GITHUB_ENV
          "TMP=$tmp" >> $env:GITHUB_ENV
          $paths = @($tmp, $env:GITHUB_WORKSPACE, (Join-Path $env:GITHUB_WORKSPACE $env:CARGO_TARGET_DIR), (Join-Path $env:USERPROFILE '.cargo'), (Join-Path $env:USERPROFILE '.rustup'))
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Add-MpPreference -ExclusionProcess 'cargo.exe', 'rustc.exe', 'cargo-nextest.exe' -ErrorAction Stop
            "Исключения Defender: $($paths -join '; ')"
          } catch {
            Write-Warning "Исключения Defender не добавлены: $_"
          }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update && rustup default stable
      # Кэш только читается: сохраняет его job `cache` (пуш в main и ночью) — кэш очереди слияния и PR другим PR не виден.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: windows
          save-if: false
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest

      # Формат и clippy — job `clippy`, параллельно.

      # Модули просмотра WASM (ADR 0007, S8-02): крейты viewers/<имя>, вне рабочей области. Собираются до тестов:
      # хост модулей берёт образец из $CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ (fb2.wasm — только
      # для тестов, в архив выпуска не входит). Нет viewers/ — шаг пропускается.
      - name: Модули просмотра (wasm32)
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(viewers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then echo "Крейтов viewers/*/ нет — пропуск"; exit 0; fi
          rustup target add wasm32-unknown-unknown
          for m in "${manifests[@]}"; do
            cargo build --manifest-path "$m" --release --target wasm32-unknown-unknown --locked
          done

      - name: Сборка тестов
        run: cargo nextest run --workspace --locked --profile ci --no-run

      # AppContainer читает exe воркера только при праве для ALL APPLICATION PACKAGES (S-1-15-2-1),
      # как в Program Files. Выдаём его каталогу сборки и требуем полной изоляции в тестах.
      - name: Права AppContainer на каталог сборки
        shell: pwsh
        run: icacls "${{ env.CARGO_TARGET_DIR }}" /grant "*S-1-15-2-1:(OI)(CI)(RX)" /T /Q

      # Doc-тестов в рабочей области нет; появятся — добавить `cargo test --doc --workspace --locked`.
      - name: Тесты
        run: cargo nextest run --workspace --locked --profile ci
        env:
          POSTMAN_REQUIRE_FULL_SANDBOX: '1'

      # Диагностика: какое ограничение песочницы мешает воркеру стартовать (по одному снимаем). Только вручную.
      - name: Диагностика песочницы
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: cargo test -p postman-worker --test windows_probe --locked -- --ignored --nocapture

  # Формат и clippy — отдельно от `test`, параллельно с ним (цель ≤7 мин на job). Кэш тот же (`windows`, только
  # чтение): окружение и установка — как у `test` и `cache`, иначе ключ не совпадёт.
  clippy:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' && github.event_name != 'schedule' &&
      !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: windows-latest
    env:
      # Компоновщик rust-lld (идёт с rustc) вместо link.exe — быстрее компонует ~100 тестовых exe. Через переменную,
      # не RUSTFLAGS: +crt-static из .cargo/config.toml остаётся. Компоновщик входит в отпечаток cargo и (как CARGO_*)
      # в ключ rust-cache — у `test`, `clippy` и `cache` окружение должно совпадать.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      # Без отладочной информации в CI (в Cargo.toml для своих крейтов — line-tables-only): меньше объём сборки
      # и кэша, быстрее компоновка. Локальная сборка не меняется.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Исключения Defender
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, (Join-Path $env:USERPROFILE '.cargo'), (Join-Path $env:USERPROFILE '.rustup'))
          try { Add-MpPreference -ExclusionPath $paths -ErrorAction Stop } catch { Write-Warning "Исключения Defender не добавлены: $_" }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: windows
          save-if: false

      # Формат — `rustfmt.toml` (решение владельца 2026-10-26); сначала: секунды, без сборки.
      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        # Не через RUSTFLAGS: он перекрыл бы +crt-static из .cargo/config.toml.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Тёплый кэш для `test` и `clippy` (решение 2026-11-12 «очень много времени теряется»): пуш в main и ночью. `test` на пуш в main
  # не идёт (код проверила очередь), а кэш из очереди слияния или PR другим PR не виден — только кэш ветки main.
  # Смена stable (раз в 6 недель) меняет ключ целиком: без ночного прогона первый PR после выпуска собирался с нуля.
  # Ключ rust-cache — хэш Cargo.lock, всех Cargo.toml, версии rustc и переменных CARGO_*/RUST*: есть такой —
  # job кончается за секунды (lookup-only, без скачивания). Нет — сборка тех же целей, что в `test` (clippy и тесты
  # без запуска), и сохранение: новый кэш (~1,3 ГБ) появляется только при смене зависимостей, старые вытесняет
  # GitHub по лимиту 10 ГБ. Окружение, шаги установки и команды сборки — те же, что в `test`, иначе ключ не совпадёт.
  cache:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'pull_request')
    runs-on: windows-latest
    env:
      # Компоновщик rust-lld (идёт с rustc) вместо link.exe — быстрее компонует ~100 тестовых exe. Через переменную,
      # не RUSTFLAGS: +crt-static из .cargo/config.toml остаётся. Компоновщик входит в отпечаток cargo и (как CARGO_*)
      # в ключ rust-cache — у `test`, `clippy` и `cache` окружение должно совпадать.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
      # Без отладочной информации в CI (в Cargo.toml для своих крейтов — line-tables-only): меньше объём сборки
      # и кэша, быстрее компоновка. Локальная сборка не меняется.
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update && rustup default stable
      - id: look
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: windows
          lookup-only: true
          save-if: false
      - name: Исключения Defender
        if: steps.look.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, (Join-Path $env:USERPROFILE '.cargo'), (Join-Path $env:USERPROFILE '.rustup'))
          try { Add-MpPreference -ExclusionPath $paths -ErrorAction Stop } catch { Write-Warning "Исключения Defender не добавлены: $_" }
      - if: steps.look.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: windows
      - if: steps.look.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-nextest
      - name: Сборка для кэша
        if: steps.look.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo nextest run --workspace --locked --profile ci --no-run

  # Тёплый кэш job `release` — тем же приёмом, что `cache`: пуш в main и ночью, lookup-only; нет ключа — release-сборка
  # и сохранение. Сам `release` на main не идёт (теги, ручной запуск, PR выпуска), его кэш PR и тегам не виден бы.
  # Окружение и команда сборки — те же, что в `release`. Кэш macOS — общий с job `bundle` workflow `macOS`.
  cache-release:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            key: windows-release
          - runner: macos-26
            key: macos-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - id: look
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ${{ matrix.key }}
          lookup-only: true
          save-if: false
      - if: steps.look.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ${{ matrix.key }}
      - name: Release-сборка для кэша
        if: steps.look.outputs.cache-hit != 'true'
        run: cargo build --release --workspace --locked --features postman-worker/viewer

  # main, теги `v*`, ручной запуск и PR, что правят выпуск: release, подпись, комплекты. Идёт параллельно с тестами —
  # красные тесты не лишают комплектов, но не дают выпуска (`publish` ждёт `test`). Платформа — строка matrix и свой
  # scripts/<os>/package с теми же выходами (name, dir, assets, version); Linux — ещё одна строка.
  # macos-arm64 (MAC-06, решение 2026-11-11 «macos»): Apple Silicon, macOS 13+, Postman.app в .zip и .dmg. Подпись
  # ad-hoc, пока у владельца нет Apple Developer ID; Developer ID и нотаризация — шаги ниже, без секретов выключены.
  # Тесты macOS — workflow `macOS`: `publish` их не ждёт.
  release:
    needs: changes
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.release == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # macOS: сборка для 13 и новее (LSMinimumSystemVersion в Info.plist — то же); на Windows не читается.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # Кэш только читается (сохраняет `cache-release`); кэш macOS — общий с job `bundle` workflow `macOS`.
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: ${{ runner.os == 'macOS' && 'macos-release' || 'windows-release' }}
          # Сохраняет job `cache-release`.
          save-if: false

      # Признак `viewer` воркера — только для `postman-viewer.exe` (S8-24, ADR 0007): в postman-worker.exe и
      # postman.exe интерпретатора WASM нет (на него ссылается только main хоста модулей).
      - name: Release-сборка
        run: cargo build --release --workspace --locked --features postman-worker/viewer

      # Подпись (S4-01, решение владельца 1): только если заданы секреты с сертификатом, иначе — уведомление
      # (scripts/windows/sign.ps1). Exe — до архива, MSI — после: хэш winget считается от подписанного MSI.
      - name: Подпись exe
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $exes = "postman.exe", "postman-worker.exe", "postman-viewer.exe" | ForEach-Object { Join-Path "$env:CARGO_TARGET_DIR/release" $_ }
          ./scripts/windows/sign.ps1 @exes

      - name: Архив
        if: runner.os == 'Windows'
        id: package
        shell: pwsh
        run: ./scripts/windows/package.ps1 -TargetDir "$env:CARGO_TARGET_DIR" -Out dist

      - name: Подпись MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./scripts/windows/sign.ps1 "${{ steps.package.outputs.msi }}"

      # Раннер — администратор: тихая установка, обновление, отказ ставить старую поверх новой, удаление.
      - name: Проверка MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/windows/msi-check.ps1 -Msi "${{ steps.package.outputs.msi }}" -Kit "${{ steps.package.outputs.dir }}"
          -Pack "$env:CARGO_TARGET_DIR/release/postman-pack.exe"

      # Манифест winget для MSI выпуска; отправка в microsoft/winget-pkgs — PR вручную (docs/DEV.md «Выпуск»).
      - name: Манифест winget
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:CARGO_TARGET_DIR/release/postman-pack.exe" winget "${{ steps.package.outputs.msi }}" dist/winget
          if ($LASTEXITCODE) { throw "postman-pack winget failed" }

      # macOS, подпись Developer ID (MAC-06): сертификат `.p12` из секретов — во временную связку ключей (пароль
      # случайный), имя подписи — в MACOS_SIGN_IDENTITY для scripts/macos/package.sh. Без секрета — подпись ad-hoc.
      - name: Сертификат Developer ID
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::notice::Нет секрета MACOS_CERT_P12_BASE64 — подпись ad-hoc (docs/DEV.md «Выпуск»)"; exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          pw="$(openssl rand -hex 16)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          p12="$RUNNER_TEMP/cert.p12"
          (umask 077; printf '%s' "$P12_BASE64" | base64 --decode > "$p12")
          security import "$p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' | head -n1)"
          if [ -z "$id" ]; then echo "::error::В MACOS_CERT_P12_BASE64 нет сертификата Developer ID Application"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      # Postman.app, zip и dmg; файлы выпуска — одна папка (выход assets). Нотаризация — только при подписи Developer ID
      # и трёх секретах Apple ID (пароль приложения — appleid.apple.com); без них — пропуск.
      - name: Postman.app, zip и dmg
        if: runner.os == 'macOS'
        id: package_macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/macos/package.sh --target-dir "$CARGO_TARGET_DIR" --out dist

      - name: Связка ключей — удалить
        if: always() && runner.os == 'macOS'
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          if [ -f "$kc" ]; then security delete-keychain "$kc"; fi

      # Тег выпуска — ровно версия из Cargo.toml: v0.2.0, v0.2.0-beta.1.
      - name: Тег = версия
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version || steps.package_macos.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией v$VERSION из Cargo.toml"; exit 1
          fi

      # Для разработки (Actions → запуск → Artifacts): postman-<версия>-windows-x64 — exe приложения, воркера и
      # хоста модулей просмотра, README.txt, install.ps1; postman-<версия>-macos-arm64 — .zip и .dmg (Postman.app
      # внутри: бандл в артефакт не кладётся — Actions теряет права на запуск и подпись).
      - name: Артефакт сборки
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.package.outputs.name || steps.package_macos.outputs.name }}
          path: ${{ steps.package.outputs.dir || steps.package_macos.outputs.dir }}
          if-no-files-found: error

      - name: Артефакт winget
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: winget-${{ steps.package.outputs.version }}
          path: dist/winget
          if-no-files-found: error

      # Файлы выпуска платформы для `publish`: Windows — архив, MSI и отдельные компоненты; macOS — .zip и .dmg.
      - name: Файлы выпуска
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ steps.package.outputs.assets || steps.package_macos.outputs.assets }}
          if-no-files-found: error

  # Выпуск на GitHub по тегу `v*`, если тесты и сборки всех платформ зелёные. Файлы — плоско:
  # postman-<версия>-<os>-<arch>.zip, .msi (Windows) и .dmg (macOS) с подписями .minisig, компоненты Windows под своими
  # именами, SHA256SUMS.txt.
  # Версия с дефисом (0.2.0-beta.1) — предварительный выпуск: его видит канал «Предварительный» в настройках.
  # Гейт выпуска (решение 2026-11-12 «release-docs-gate»): тег публикуется, только если в его коммите есть
  # docs/releases/<версия>.md — сверка всей документации (каждый документ отмечен и с итогом). Быстро, до сборки.
  docs-gate:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Сверка документации к выпуску
        shell: bash
        run: python3 .github/release_docs_check.py "${GITHUB_REF_NAME#v}" "*.md" "docs/*.md" "scripts/*/README.txt" .github/release-notes.md

  publish:
    needs: [test, release, docs-gate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      # Подпись обновления (решение 2026-11-11 «self-update», pets `crates/pets-update/README.md`): каждый .msi, .zip и .dmg —
      # minisign, рядом `<файл>.minisig`; программа ставит только подписанное вшитым ключом. Подписывается готовый файл
      # (MSI — после Authenticode), до SHA256SUMS.txt. Без секрета выпуск красный, а не «без подписи»: выпуск без
      # .minisig программа не предлагает. Ключ в журнал не попадает: файл во временной папке, удаляется по выходу.
      - name: Подпись обновления (minisign)
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}   # та же строка RW…, что вшита в программу
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::нет секрета UPDATE_SIGNING_KEY"; exit 1; fi
          if [ -z "$UPDATE_PUBLIC_KEY" ]; then echo "::error::нет переменной UPDATE_PUBLIC_KEY"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y minisign >/dev/null
          key="$RUNNER_TEMP/update.key"
          (umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          cd assets
          shopt -s nullglob
          for f in *.msi *.zip *.dmg; do
            minisign -S -s "$key" -m "$f"            # пишет $f.minisig; в подписи — file:$f
            minisign -V -P "$UPDATE_PUBLIC_KEY" -m "$f"
          done
      # Страница — для пользователей (.github/release-notes.md): готовность и что скачать, без списка PR.
      # Блоки: pre или stable — по версии; unsigned (подсказка про SmartScreen) — пока нет подписи Windows;
      # mac-unsigned («Всё равно открыть») — пока нет подписи Developer ID с нотаризацией.
      - name: Выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
          MAC_NOTARIZED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then pre=(--prerelease); drop=stable; else pre=(); drop=pre; fi
          if [ "$SIGNED" = true ]; then cut=unsigned; else cut=none; fi
          if [ "$MAC_NOTARIZED" = true ]; then cutmac=mac-unsigned; else cutmac=none; fi
          sed -e "/^<!-- $drop -->/,/^<!-- \/$drop -->/d" -e "/^<!-- $cut -->/,/^<!-- \/$cut -->/d" \
            -e "/^<!-- $cutmac -->/,/^<!-- \/$cutmac -->/d" \
            -e '/^<!-- .* -->$/d' -e "s/{version}/$version/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Postman $version" --notes-file notes.md "${pre[@]}"

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, test, clippy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
