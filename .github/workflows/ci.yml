# CI Postman по шаблону скилла pets-dev (R-01).
# PR и merge queue: метки конфликта, полосы, clippy, тесты (nextest) — цель ≤7 мин при тёплом кэше.
# Docs-PR: сборка пропускается (job `changes`). Release, подпись, архив — только main, `beta-*` и ручной запуск.
# Required check в защите main — один: `gate`.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['beta-*']
  workflow_dispatch:

concurrency:
  # Новый пуш в PR отменяет устаревший прогон.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Каталог сборки задан явно (H-01): шаги ниже ссылаются на него, а не на зашитый target/.
  CARGO_TARGET_DIR: target

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Нет меток конфликта слияния
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.png'; then
            echo "Метки конфликта слияния в файлах выше"; exit 1
          fi

      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then echo rust=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE" HEAD > changed.txt
          # Полосы: PR правит одну полосу (x/* — межполосный PR класса B).
          if [ -f lanes.toml ] && [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          if grep -qvE '^(docs/|[^/]*\.md$|.*/README\.md$)' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  # Формат (`cargo fmt --check`) пока не проверяется: код не приведён к rustfmt — решение владельца.
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Clippy
        # Не через RUSTFLAGS: он перекрыл бы +crt-static из .cargo/config.toml.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Сборка тестов
        run: cargo nextest run --workspace --locked --profile ci --no-run

      # AppContainer читает exe воркера только при праве для ALL APPLICATION PACKAGES (S-1-15-2-1),
      # как в Program Files. Выдаём его каталогу сборки и требуем полной изоляции в тестах.
      - name: Права AppContainer на каталог сборки
        shell: pwsh
        run: icacls "${{ env.CARGO_TARGET_DIR }}" /grant "*S-1-15-2-1:(OI)(CI)(RX)" /T /Q

      # Doc-тестов в рабочей области нет; появятся — добавить `cargo test --doc --workspace --locked`.
      - name: Тесты
        run: cargo nextest run --workspace --locked --profile ci
        env:
          POSTMAN_REQUIRE_FULL_SANDBOX: '1'

      # Диагностика: какое ограничение песочницы мешает воркеру стартовать (по одному снимаем). Только вручную.
      - name: Диагностика песочницы
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: cargo test -p postman-worker --test windows_probe --locked -- --ignored --nocapture

  # Только main, бета и ручной запуск: release, подпись, архив. Идёт параллельно с тестами —
  # красные тесты не лишают архива.
  release:
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Release-сборка
        run: cargo build --release --workspace --locked

      # Подпись (S4-01, решение владельца 1): только если заданы секреты с сертификатом, иначе — уведомление.
      # WINDOWS_CERT_PFX_BASE64 — .pfx в base64, WINDOWS_CERT_PASSWORD — пароль; сервер меток времени —
      # переменная WINDOWS_TIMESTAMP_URL (по умолчанию DigiCert).
      - name: Подпись exe
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            "::notice title=Подпись::Секреты WINDOWS_CERT_PFX_BASE64 и WINDOWS_CERT_PASSWORD не заданы — архив без подписи"
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $exes = "postman.exe", "postman-worker.exe" | ForEach-Object { Join-Path "$env:CARGO_TARGET_DIR/release" $_ }
          $pfx = Join-Path $env:RUNNER_TEMP "postman-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr $ts /td SHA256 /d Postman @exes
            if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # Цепочка внутреннего CA на раннере может быть недоверенной — тогда предупреждение, не ошибка.
          & $signtool.FullName verify /pa @exes
          if ($LASTEXITCODE) { "::warning title=Подпись::signtool verify: цепочка сертификата не проверена на раннере" }

      - name: Архив
        id: package
        shell: pwsh
        run: ./scripts/windows/package.ps1 -TargetDir "$env:CARGO_TARGET_DIR" -Out dist

      # Артефакт скачивается как Postman-<версия>-windows-x64.zip с четырьмя файлами внутри.
      - name: Артефакт Windows
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
