# CI Postman по шаблону скилла pets-dev (R-01).
# PR и merge queue: метки конфликта, полосы, clippy, тесты (nextest) — цель ≤7 мин при тёплом кэше.
# Docs-PR: сборка пропускается (job `changes`). Release, подпись, архив — только main, теги `v*` и ручной запуск;
# тег `v*` — ещё и выпуск на GitHub (job `publish`, схема — docs/DEV.md «Выпуск»).
# Required check в защите main — один: `gate`.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # Новый пуш в PR отменяет устаревший прогон.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Каталог сборки задан явно (H-01): шаги ниже ссылаются на него, а не на зашитый target/.
  CARGO_TARGET_DIR: target

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Нет меток конфликта слияния
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)|^=======$' -- . ':!*.png'; then
            echo "Метки конфликта слияния в файлах выше"; exit 1
          fi

      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then echo rust=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c core.quotepath=off diff --name-only "$BASE" HEAD > changed.txt
          # Полосы: PR правит одну полосу (x/* — межполосный PR класса B).
          if [ -f lanes.toml ] && [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          if grep -qvE '^(docs/|[^/]*\.md$|.*/README\.md$)' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Формат — `rustfmt.toml` (решение владельца 2026-10-26); сначала: секунды, без сборки.
      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        # Не через RUSTFLAGS: он перекрыл бы +crt-static из .cargo/config.toml.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Модули просмотра WASM (ADR 0007, S8-02): крейты viewers/<имя>, вне рабочей области. Собираются до тестов:
      # хост модулей берёт образец из $CARGO_TARGET_DIR/wasm32-unknown-unknown/release/ (fb2.wasm — только
      # для тестов, в архив выпуска не входит). Нет viewers/ — шаг пропускается.
      - name: Модули просмотра (wasm32)
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(viewers/*/Cargo.toml)
          if [ ${#manifests[@]} -eq 0 ]; then echo "Крейтов viewers/*/ нет — пропуск"; exit 0; fi
          rustup target add wasm32-unknown-unknown
          for m in "${manifests[@]}"; do
            cargo build --manifest-path "$m" --release --target wasm32-unknown-unknown --locked
          done

      - name: Сборка тестов
        run: cargo nextest run --workspace --locked --profile ci --no-run

      # AppContainer читает exe воркера только при праве для ALL APPLICATION PACKAGES (S-1-15-2-1),
      # как в Program Files. Выдаём его каталогу сборки и требуем полной изоляции в тестах.
      - name: Права AppContainer на каталог сборки
        shell: pwsh
        run: icacls "${{ env.CARGO_TARGET_DIR }}" /grant "*S-1-15-2-1:(OI)(CI)(RX)" /T /Q

      # Doc-тестов в рабочей области нет; появятся — добавить `cargo test --doc --workspace --locked`.
      - name: Тесты
        run: cargo nextest run --workspace --locked --profile ci
        env:
          POSTMAN_REQUIRE_FULL_SANDBOX: '1'

      # Диагностика: какое ограничение песочницы мешает воркеру стартовать (по одному снимаем). Только вручную.
      - name: Диагностика песочницы
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: cargo test -p postman-worker --test windows_probe --locked -- --ignored --nocapture

  # Только main, теги `v*` и ручной запуск: release, подпись, архив. Идёт параллельно с тестами — красные тесты не
  # лишают архива, но не дают выпуска (`publish` ждёт `test`). Платформа — строка matrix; Linux — ещё одна строка
  # и свой scripts/<os>/package с теми же выходами (name, dir, assets, version).
  release:
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Признак `viewer` воркера — только для `postman-viewer.exe` (S8-24, ADR 0007): в postman-worker.exe и
      # postman.exe интерпретатора WASM нет (на него ссылается только main хоста модулей).
      - name: Release-сборка
        run: cargo build --release --workspace --locked --features postman-worker/viewer

      # Подпись (S4-01, решение владельца 1): только если заданы секреты с сертификатом, иначе — уведомление.
      # WINDOWS_CERT_PFX_BASE64 — .pfx в base64, WINDOWS_CERT_PASSWORD — пароль; сервер меток времени —
      # переменная WINDOWS_TIMESTAMP_URL (по умолчанию DigiCert).
      - name: Подпись exe
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            "::notice title=Подпись::Секреты WINDOWS_CERT_PFX_BASE64 и WINDOWS_CERT_PASSWORD не заданы — архив без подписи"
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $ts = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $exes = "postman.exe", "postman-worker.exe", "postman-viewer.exe" |
            ForEach-Object { Join-Path "$env:CARGO_TARGET_DIR/release" $_ } | Where-Object { Test-Path -LiteralPath $_ }
          $pfx = Join-Path $env:RUNNER_TEMP "postman-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr $ts /td SHA256 /d Postman @exes
            if ($LASTEXITCODE) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          # Цепочка внутреннего CA на раннере может быть недоверенной — тогда предупреждение, не ошибка.
          & $signtool.FullName verify /pa @exes
          if ($LASTEXITCODE) { "::warning title=Подпись::signtool verify: цепочка сертификата не проверена на раннере" }

      - name: Архив
        id: package
        shell: pwsh
        run: ./scripts/windows/package.ps1 -TargetDir "$env:CARGO_TARGET_DIR" -Out dist

      # Тег выпуска — ровно версия из Cargo.toml: v0.2.0, v0.2.0-beta.1.
      - name: Тег = версия
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией v$VERSION из Cargo.toml"; exit 1
          fi

      # Для разработки (Actions → запуск → Artifacts): postman-<версия>-windows-x64 — exe приложения, воркера и
      # хоста модулей просмотра, README.txt, install.ps1.
      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error

      # Файлы выпуска платформы для `publish`: архив и отдельные компоненты.
      - name: Файлы выпуска
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error

  # Выпуск на GitHub по тегу `v*`, если тесты и сборки всех платформ зелёные. Файлы — плоско:
  # postman-<версия>-<os>-<arch>.zip, компоненты под своими именами, SHA256SUMS.txt. Версия с дефисом
  # (0.2.0-beta.1) — предварительный выпуск: его видит канал «Предварительный» в настройках.
  publish:
    needs: [test, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          version="${GITHUB_REF_NAME#v}"
          sed "s/{version}/$version/g" .github/release-notes.md > notes.md
          pre=(); case "$version" in *-*) pre=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" assets/* -R "$GITHUB_REPOSITORY" --verify-tag \
            --title "Postman $version" --notes-file notes.md --generate-notes "${pre[@]}"

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
